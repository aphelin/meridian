{{- if .Values.ingress.enabled }}
{{- $store := dict }}
{{- range .Values.services }}{{ if eq .name "storefront" }}{{ $store = . }}{{ end }}{{ end }}
{{- if not $store }}{{ fail "ingress.enabled requires a storefront entry in services" }}{{ end }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}
  labels:
    {{- include "meridian.labels" (dict "root" $ "name" "ingress") | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  rules:
    - {{- with .Values.ingress.host }}
      host: {{ . | quote }}
      {{- end }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: storefront
                port:
                  number: {{ $store.port }}
{{- end }}
