{{- if not .Values.existingSecret }}
{{- $name := include "meridian.secretName" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $current := dict }}
{{- if $existing }}{{ $current = $existing.data }}{{ end }}
{{- $db := .Values.database }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "meridian.labels" (dict "root" $ "name" "secrets") | nindent 4 }}
type: Opaque
data:
  {{- range $key, $value := .Values.secrets }}
  {{- if and (not $value) (has $key (list "JWT_SECRET" "ORDER_LINK_SECRET")) }}
  {{- if hasKey $current $key }}
  {{ $key }}: {{ index $current $key }}
  {{- else }}
  {{ $key }}: {{ randAlphaNum 48 | b64enc }}
  {{- end }}
  {{- else }}
  {{ $key }}: {{ toString $value | b64enc | quote }}
  {{- end }}
  {{- end }}
  {{- range .Values.services }}
  {{- if .database }}
  {{ .database.env }}: {{ printf "postgresql://%s:%s@%s:%v/%s?schema=%s" (urlquery $db.user) (urlquery $db.password) $db.host $db.port $db.name .database.schema | b64enc | quote }}
  {{- end }}
  {{- end }}
{{- end }}
